name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809
        with:
          path: camera_daily_merger
      - run: mkdir -p work
      - run: docker build --platform linux/amd64 -t merger:test camera_daily_merger
      - run: python tests/integration/check_container.py --image merger:test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/integration/check_pipeline.py --image merger:test
      - run: python tests/integration/check_pipeline.py --image merger:test --compact
      - run: python tests/integration/check_pipeline.py --image merger:test --compact --archived-dst
      - run: python tests/integration/check_pipeline.py --image merger:test --compact --mixed-rate
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p work
      - run: |
          python - <<'PY'
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = playwright.chromium.executable_path
          for suite in ('check_browser', 'check_gallery_browser', 'check_dashboard_card'):
              subprocess.run([sys.executable, '-m', 'tests.integration.' + suite, '--chromium', executable], check=True)
          PY
